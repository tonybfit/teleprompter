name: Make icons
# PNG icons are generated from tools/make_icons.py (stdlib only) and committed to the repo root,
# because the repo was published through a text-only API.
on:
  push:
    paths: ['tools/make_icons.py', '.github/workflows/make-icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and commit
        run: |
          python3 tools/make_icons.py
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate PNG icons" && git push)
